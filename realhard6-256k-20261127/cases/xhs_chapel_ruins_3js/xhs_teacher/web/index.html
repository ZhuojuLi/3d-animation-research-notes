<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VESPER — 暮色山间教堂</title>
  <meta name="description" content="一件可交互的 Three.js 黄昏场景：废弃山间教堂、拱门烛火与风中的枯草。">
  <style>
    :root {
      --ink: #f4e8d8;
      --muted: rgba(244, 232, 216, 0.58);
      --faint: rgba(244, 232, 216, 0.24);
      --amber: #e9b170;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #100c11;
      color: var(--ink);
      font-family: "Cormorant Garamond", "Iowan Old Style", "Baskerville", "Times New Roman", "Songti SC", "Noto Serif CJK SC", serif;
      -webkit-font-smoothing: antialiased;
    }
    #scene {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    /* A whisper of analog texture sits over the live canvas. */
    .screen-grain {
      position: fixed;
      inset: -40%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.11;
      mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.55'/></svg>");
      background-size: 280px 280px;
      transform: rotate(9deg);
    }
    .ui {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.1s ease;
    }
    body.ready .ui { opacity: 1; }
    .brand {
      position: absolute;
      left: clamp(22px, 3.4vw, 58px);
      top: clamp(22px, 4.6vh, 54px);
      display: flex;
      align-items: flex-start;
      gap: 14px;
      opacity: 0;
      transform: translateY(7px);
    }
    body.ready .brand {
      animation: brand-in 1.8s cubic-bezier(.22,.8,.3,1) .35s forwards,
                 brand-out 1.7s ease 4.7s forwards;
    }
    .brand-rule {
      width: 1px;
      height: 42px;
      background: linear-gradient(to bottom, var(--amber), transparent);
      opacity: .8;
    }
    .brand-copy { display: flex; flex-direction: column; gap: 4px; }
    .brand-title {
      font-size: 12px;
      letter-spacing: .42em;
      font-weight: 500;
      color: rgba(255, 239, 216, .92);
      text-transform: uppercase;
    }
    .brand-cn {
      font-size: 12px;
      letter-spacing: .27em;
      color: var(--muted);
      font-family: "Songti SC", "Noto Serif CJK SC", "STSong", serif;
    }
    .hint {
      position: absolute;
      left: 50%;
      bottom: clamp(22px, 4vh, 42px);
      transform: translate(-50%, 8px);
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 10.5px;
      letter-spacing: .2em;
      color: var(--muted);
      white-space: nowrap;
      opacity: 0;
      transition: opacity .65s ease, transform .65s ease;
      text-shadow: 0 1px 10px rgba(20, 12, 10, 0.65);
    }
    .hint::before, .hint::after {
      content: "";
      width: 26px;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(232, 199, 156, 0.45), transparent);
    }
    .hint i {
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(235, 190, 129, 0.55);
    }
    body.active .hint, body.focused .hint {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    .focus-note {
      position: absolute;
      right: clamp(22px, 3.4vw, 58px);
      bottom: clamp(24px, 4.2vh, 44px);
      font-size: 10px;
      letter-spacing: .24em;
      color: rgba(246, 206, 151, .68);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .8s ease, transform .8s ease;
      text-shadow: 0 1px 12px rgba(20, 10, 5, .7);
    }
    body.focused .focus-note { opacity: 1; transform: none; }
    .loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      background:
        radial-gradient(120% 90% at 28% 36%, rgba(98, 61, 53, .5) 0%, rgba(20, 14, 17, .98) 62%),
        #100c11;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      transition: opacity 1.6s cubic-bezier(.4,0,.2,1), visibility 1.6s;
    }
    body.ready .loader {
      opacity: 0;
      visibility: hidden;
    }
    .loader-title {
      font-size: 13px;
      letter-spacing: .6em;
      color: rgba(240, 216, 184, .86);
      text-indent: .6em;
      animation: breathe 3.4s ease-in-out infinite;
    }
    .loader-line {
      width: 130px;
      height: 1px;
      overflow: hidden;
      background: rgba(225, 188, 140, .12);
      position: relative;
    }
    .loader-line::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(238, 191, 128, .8), transparent);
      animation: load 2.6s ease-in-out infinite;
    }
    .loader-sub {
      font-size: 9.5px;
      letter-spacing: .32em;
      color: rgba(230, 205, 177, .32);
      text-transform: uppercase;
    }
    body.focused .screen-grain { opacity: 0.15; }
    @keyframes breathe {
      0%, 100% { opacity: .45; }
      50% { opacity: .9; }
    }
    @keyframes load {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(110%); }
    }
    @keyframes brand-in {
      to { opacity: 1; transform: none; }
    }
    @keyframes brand-out {
      to { opacity: 0; transform: translateY(-4px); }
    }
    @media (max-width: 700px) {
      .hint { gap: 9px; font-size: 9px; letter-spacing: .12em; }
      .hint::before, .hint::after { width: 12px; }
      .focus-note { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .loader-title, .loader-line::after { animation: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <main id="scene" aria-label="Interactive 3D sunset chapel scene"></main>
  <div class="screen-grain" aria-hidden="true"></div>
  <div class="ui" aria-hidden="true">
    <div class="brand">
      <div class="brand-rule"></div>
      <div class="brand-copy">
        <div class="brand-title">Vesper</div>
        <div class="brand-cn">暮色 · 废弃山间教堂</div>
      </div>
    </div>
    <div class="hint">
      <span>拖拽环视</span><i></i><span>滚轮靠近</span><i></i><span>点击拱门</span>
    </div>
    <div class="focus-note">烛火渐明&nbsp;&nbsp;·&nbsp;&nbsp;ESC 返回</div>
  </div>
  <div class="loader" id="loader">
    <div class="loader-title">VESPER</div>
    <div class="loader-line"></div>
    <div class="loader-sub">The last light in the hills</div>
  </div>
  <noscript>
    <div style="position:fixed;inset:0;display:grid;place-items:center;background:#100c11;z-index:20">
      此作品需要启用 JavaScript 与 WebGL。
    </div>
  </noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
