<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMW E30 Classic Restoration Garage · 经典车修复车库</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1d22;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      inset: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Ultra-compact translucent glassmorphic workshop control bar at bottom-right */
    #hud {
      position: fixed;
      right: 12px;
      bottom: 10px;
      z-index: 20;
      background: rgba(14, 17, 22, 0.62);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9px;
      padding: 6px 10px;
      color: #e8edf4;
      font-size: 11.5px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.36);
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 24px);
      flex-wrap: wrap;
    }
    #hud-body {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }
    #hud-body.collapsed {
      display: none;
    }
    .hud-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .hud-sep {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.16);
    }
    .hud-label {
      color: #aeb7c4;
      font-weight: 500;
      white-space: nowrap;
    }
    .hud-val {
      font-variant-numeric: tabular-nums;
      color: #82b8ff;
      min-width: 34px;
      text-align: right;
      font-weight: 600;
    }
    input[type="range"] {
      width: 68px;
      height: 4px;
      accent-color: #1f74d8;
      cursor: pointer;
    }
    button {
      background: rgba(255, 255, 255, 0.09);
      color: #e6ebf2;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 5px;
      padding: 3px 7px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    button:hover {
      background: rgba(45, 125, 220, 0.35);
      border-color: rgba(110, 175, 255, 0.5);
    }
    button.active {
      background: rgba(20, 102, 198, 0.72);
      border-color: rgba(125, 190, 255, 0.75);
      color: #ffffff;
    }
    #btn-toggle-hud {
      padding: 3px 6px;
      opacity: 0.78;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/build/three.module.js",
        "three/addons/": "./vendor/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud" role="region" aria-label="BMW E30 修复车间交互控制">
    <div id="hud-body">
      <div class="hud-group">
        <span class="hud-label">举升</span>
        <input id="lift-slider" type="range" min="0" max="1.10" step="0.01" value="0.00" title="调节双柱举升机高度" />
        <span id="lift-val" class="hud-val">0.00m</span>
        <button id="btn-lift-toggle" type="button">升起举升机</button>
      </div>
      <div class="hud-sep"></div>
      <div class="hud-group">
        <button id="btn-door-toggle" type="button">拉开车门</button>
        <button id="btn-lights-toggle" type="button">四圆灯</button>
      </div>
      <div class="hud-sep"></div>
      <div class="hud-group">
        <button type="button" class="active" data-preset="default">默认机位</button>
        <button type="button" data-preset="interior">侧前看内饰</button>
        <button type="button" data-preset="frontWheel">前脸与轮毂</button>
        <button type="button" data-preset="undercarriage">举升观底盘</button>
      </div>
    </div>
    <button id="btn-toggle-hud" type="button" title="收起/展开控制栏 (H)">收起</button>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
