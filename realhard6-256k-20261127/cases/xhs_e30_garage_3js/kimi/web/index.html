<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E30 · The Restoration Bay</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<main id="viewport" aria-label="可交互的宝马 E30 修复车库三维场景">
  <canvas id="scene"></canvas>
  <div id="loading"><div class="loader-mark">BMW <span>E30</span></div><div class="loader-line"><i></i></div><small>PREPARING THE WORKSHOP</small></div>
  <header class="masthead">
    <div class="brand"><span class="roundel">K</span><div><b>Klassik Werkstatt</b><small>RESTORATION BAY / 03</small></div></div>
    <div class="edition"><span id="live-dot"></span> BMW E30 <b>1986</b></div>
  </header>
  <section class="caption"><span>司机侧 · 双柱工位</span><h1>The art of<br><em>keeping classics alive.</em></h1><p>深灰蓝车漆 / 银色编织轮毂 / 原汁原味的修理日常</p></section>
  <aside class="hint"><span class="mouse-icon"></span><span>拖动环视 · 滚轮缩放<br><small>点击左前车门，或从下方工位控制开始</small></span></aside>
  <section class="dock" aria-label="场景控制">
    <div class="operation">
      <button id="lift-btn" class="main-action" aria-pressed="false"><span class="icon lift-icon">↥</span><span><small>HYDRAULIC LIFT</small><b id="lift-label">升起车辆</b></span></button>
      <div class="range-wrap"><label for="lift-range">离地高度 <output id="height-output">0 cm</output></label><input id="lift-range" type="range" min="0" max="100" value="0" aria-label="举升高度"></div>
    </div>
    <div class="divider"></div>
    <button id="door-btn" class="square-action" aria-pressed="false"><span class="door-icon">▱</span><b id="door-label">打开车门</b></button>
    <div class="divider views-divider"></div>
    <nav class="views" aria-label="观察视角"><button data-view="default" class="active">全景</button><button data-view="front">前脸</button><button data-view="wheel">轮毂</button><button data-view="interior">内饰</button><button data-view="underbody">底盘</button></nav>
    <button id="reset-btn" title="恢复初始场景" aria-label="恢复初始场景">↺</button>
  </section>
  <div class="status"><span id="car-status">VEHICLE RESTING · 0 MM</span><span>THREE.JS / REAL-TIME WEBGL</span></div>
  <div id="focus-toast" role="status"></div>
</main>
<script type="module" src="./js/main.js"></script>
</body></html>
