<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swiss Flying Tourbillon &amp; Anchor Escapement — Horology Lab</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./vendor/gsap/gsap.min.js"></script>
</head>
<body>
  <div id="app">
    <div id="left-column">
      <div id="stage-wrap" data-stage="hybrid">
        <canvas id="movement-canvas" aria-label="Swiss Flying Tourbillon and Anchor Escapement Mechanism"></canvas>
        <svg id="stage-svg" viewBox="0 0 1000 610" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <g id="svg-kinematic-guides"></g>
          <g id="svg-power-path"></g>
          <g id="svg-escapement-callouts"></g>
          <g id="svg-tourbillon-hud"></g>
        </svg>
      </div>

      <footer id="diagnostics-bar" data-hud="true">
        <div class="diag-cell diag-phase-cell">
          <div class="phase-plot-wrap">
            <canvas id="phase-canvas" width="96" height="96"></canvas>
          </div>
          <div class="phase-labels">
            <div class="phase-label-group">
              <span class="diag-title">PHASE</span>
              <span class="diag-sub">portrait</span>
            </div>
            <div class="phase-label-group">
              <span class="diag-sub-bright">Amplitude</span>
              <span class="diag-sub">trace</span>
            </div>
          </div>
          <div class="amp-plot-wrap">
            <canvas id="amplitude-canvas" width="210" height="84"></canvas>
          </div>
        </div>

        <div class="diag-divider"></div>

        <div class="diag-cell diag-beat-cell">
          <span class="diag-kicker">BEAT ERROR</span>
          <span id="beat-error-val" class="diag-metric">+0.1 ms</span>
        </div>

        <div class="diag-divider"></div>

        <div class="diag-cell diag-timeline-cell">
          <div class="timeline-header">
            <span class="diag-kicker">SLOW-MOTION TIMELINE</span>
            <div class="transport-controls">
              <span id="act-indicator" class="act-badge">ACT I • 0.0s</span>
              <button id="play" class="icon-btn" type="button" title="Play simulation" aria-label="Play">&#9654;</button>
              <button id="pause" class="icon-btn" type="button" title="Pause simulation" aria-label="Pause">&#10074;&#10074;</button>
              <button id="reset" class="icon-btn" type="button" title="Reset to initial state" aria-label="Reset">&#8634;</button>
            </div>
          </div>
          <div class="scrub-row">
            <input id="scrub" class="gold-slider scrub-slider" type="range" min="0" max="16" step="0.01" value="0" aria-label="Timeline scrub" />
          </div>
          <div class="timeline-footer">
            <span id="timeline-rate-val" class="timeline-rate">0.25&times;</span>
          </div>
        </div>
      </footer>
    </div>

    <aside id="controls-panel" data-hud="true">
      <div class="control-stack">
        <div class="control-block">
          <label class="control-label" for="hairspring-stiffness">Hairspring Stiffness</label>
          <input id="hairspring-stiffness" class="gold-slider" type="range" min="0.60" max="1.40" step="0.01" value="1.00" />
          <div id="stiffness-val" class="control-readout">1.00&times;</div>
        </div>

        <div class="control-block">
          <label class="control-label" for="mainspring-torque">Mainspring Torque</label>
          <input id="mainspring-torque" class="gold-slider" type="range" min="0.40" max="1.20" step="0.01" value="0.85" />
          <div id="torque-val" class="control-readout">0.85 N&middot;mm</div>
        </div>

        <div class="control-block">
          <label class="control-label" for="time-scale">Time Scale</label>
          <input id="time-scale" class="gold-slider" type="range" min="0.05" max="1.00" step="0.01" value="0.25" />
          <div id="timescale-val" class="control-readout">0.25&times;</div>
        </div>

        <div class="control-block">
          <label class="control-label" for="cutaway-opacity">Cutaway Opacity</label>
          <input id="cutaway-opacity" class="gold-slider" type="range" min="0" max="100" step="1" value="85" />
          <div id="cutaway-val" class="control-readout">85%</div>
        </div>
      </div>

      <fieldset class="panel-box ratios-box">
        <legend class="panel-legend">TRAIN RATIOS</legend>
        <div class="ratio-grid">
          <span class="ratio-name">Barrel</span><span class="ratio-val">80:12</span>
          <span class="ratio-name">Center</span><span class="ratio-val">75:10</span>
          <span class="ratio-name">Third</span><span class="ratio-val">70:8</span>
          <span class="ratio-name">Escape</span><span class="ratio-val">15:2</span>
        </div>
      </fieldset>

      <fieldset class="panel-box status-box">
        <legend class="panel-legend">ESCAPEMENT STATUS</legend>
        <div id="escapement-status-val" class="status-readout">LOCKED &bull; 295&deg;</div>
      </fieldset>
    </aside>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
