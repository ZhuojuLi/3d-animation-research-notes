<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Draft & Bookbinding Atelier — Mechanical Study</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <main id="atelier" aria-label="Interactive drafting and bookbinding desk">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="scene-title scene-description">
      <title id="scene-title">Draft and bookbinding atelier</title>
